# Build das imagens de produção FORA da VPS (a VPS só faz `docker pull`).
#
#   app  ← Dockerfile, estágio `runtime` (serviço `app` do compose.prod.yml)
#   ops  ← Dockerfile, estágio `ops`     (serviço one-shot `migrate`)
#
# Tags: `sha-<commit curto>` e `latest` SÓ a partir da main (código que passou
# por PR); dispatch de outra branch publica só `branch-<commit curto>`, que o
# deploy recusa. `sha-…` é o que o deploy/rollback usa.
# Actions fixadas por SHA de commit (versão no comentário); atualize os dois juntos.
#
# Deploy automático: depois do build de um push na main, o job `deploy` assume
# uma role da AWS por OIDC (sem chave guardada) e manda, por SSM Run Command, o
# documento `ij-crm-deploy` (deploy/ssm-deploy.yaml) com a tag e os DIGESTS das
# imagens recém-publicadas; na VPS, scripts/deploy-remoto.sh confere tudo e roda
# `scripts/deploy.sh`. Porta 22 fechada. Configuração no environment `producao`
# (variáveis AWS_DEPLOY_ROLE_ARN, AWS_REGION, DEPLOY_INSTANCE_ID); sem elas o job
# é pulado com aviso. Pausa: variável de repositório DEPLOY_AUTOMATICO=false.
# Ver docs/runbook.md, "Deploy automático (GitHub Actions + AWS SSM)".
name: imagens

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada por padrão; cada job pede só o que usa.
permissions: {}

# Dois pushes seguidos na main: o segundo espera (build E deploy do primeiro);
# `latest` nunca regride.
concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/gabriel-marques-tech
  # Arquitetura da VPS. Instância Graviton (t4g/m7g/…): defina a variável de
  # repositório IMAGE_PLATFORMS=linux/arm64 (build via QEMU, bem mais lento).
  PLATAFORMAS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest_app: ${{ steps.push-app.outputs.digest }}
      digest_ops: ${{ steps.push-ops.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # histórico para comparar as migrations com o push anterior

      # Expand/contract: migration nova destrutiva sem `-- destrutiva-ok:` barra o
      # build (e portanto o deploy). Nos PRs o mesmo check roda em migrations.yml.
      - name: Migrations destrutivas
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.before }}
        run: scripts/checar-migrations.sh "$BASE"

      - name: QEMU (só para arm64)
        if: contains(env.PLATAFORMAS, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags do app
        id: meta-app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-app
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=branch-,format=short,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # A tag que o deploy usa, conferida contra a lista que o metadata-action
      # gerou (e que o build abaixo publica). O deploy leva a tag E os digests.
      - name: Tag imutável do deploy
        id: tag
        if: github.ref == 'refs/heads/main'
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          IMAGEM: ${{ env.REGISTRO }}/ij-crm-app
        run: |
          tag="sha-${GITHUB_SHA::7}"
          grep -qxF "$IMAGEM:$tag" <<<"$TAGS_APP" \
            || { echo "::error::$IMAGEM:$tag não está nas tags geradas: $TAGS_APP"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tags do ops
        id: meta-ops
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-ops
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=branch-,format=short,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Mesmo builder nos dois passos: o estágio `deps` (pnpm install) do app é
      # reaproveitado pelo ops. Cache entre execuções no cache do GitHub Actions.
      - name: Build + push app (runtime)
        id: push-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build + push ops (migrate)
        id: push-ops
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ops
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-ops.outputs.tags }}
          labels: ${{ steps.meta-ops.outputs.labels }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=ops
          cache-to: type=gha,scope=ops,mode=max

      - name: Resumo
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          TAGS_OPS: ${{ steps.meta-ops.outputs.tags }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST_APP: ${{ steps.push-app.outputs.digest }}
          DIGEST_OPS: ${{ steps.push-ops.outputs.digest }}
          PAUSADO: ${{ vars.DEPLOY_AUTOMATICO == 'false' }}
        run: |
          {
            echo "### Imagens publicadas"
            echo
            echo '```'
            echo "$TAGS_APP"
            echo "$TAGS_OPS"
            echo "app@$DIGEST_APP"
            echo "ops@$DIGEST_OPS"
            echo '```'
            echo
            if [[ -z "$TAG" ]]; then
              echo "Build fora da main: tags \`branch-…\`, que o deploy não aceita."
            else
              if [[ "$PAUSADO" == "true" ]]; then
                echo "Deploy automático **pausado** (variável DEPLOY_AUTOMATICO=false)."
              fi
              echo "Deploy manual na VPS: \`scripts/deploy.sh $TAG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  # Deploy automático na VPS (AWS) da imagem que o job `build` acabou de publicar,
  # por AWS SSM Run Command (porta 22 fechada; credencial temporária via OIDC).
  # Só em push na main com build ok; pausável com a variável de repositório
  # DEPLOY_AUTOMATICO=false (o job aparece como "skipped").
  deploy:
    needs: build
    if: >-
      success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_AUTOMATICO != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Só o token OIDC para a AWS; nenhum acesso ao repo (sem checkout).
    permissions:
      id-token: write
    environment:
      name: producao
    # Um deploy por vez, na ordem dos merges; um em andamento nunca é cancelado.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      DIGEST_APP: ${{ needs.build.outputs.digest_app }}
      DIGEST_OPS: ${{ needs.build.outputs.digest_ops }}
      # Configuração (não são segredos), no environment `producao`.
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      REGIAO: ${{ vars.AWS_REGION }}
      INSTANCIA: ${{ vars.DEPLOY_INSTANCE_ID }}
      DOCUMENTO: ij-crm-deploy
    steps:
      # Sem a VPS ainda: nenhuma variável → pula com aviso + warning (verde, mas
      # visível: uma variável apagada por engano não passa despercebida).
      # Configuração pela metade ou inválida → falha.
      - name: Conferir configuração
        id: config
        run: |
          faltam=()
          for v in ROLE_ARN REGIAO INSTANCIA; do [[ -n "${!v}" ]] || faltam+=("$v"); done
          if [[ ${#faltam[@]} -eq 3 ]]; then
            echo "::notice title=Deploy pulado::Variáveis AWS_DEPLOY_ROLE_ARN, AWS_REGION e DEPLOY_INSTANCE_ID ausentes no environment producao (runbook: Deploy automático). Imagem $TAG publicada, sem deploy."
            echo "::warning title=Deploy automático NÃO rodou::sem configuração da AWS no environment producao; se a VPS já existe, alguém apagou as variáveis."
            {
              echo "### Deploy automático: pulado"
              echo
              echo "Variáveis \`AWS_DEPLOY_ROLE_ARN\`, \`AWS_REGION\` e \`DEPLOY_INSTANCE_ID\` ausentes no environment \`producao\`."
              echo "Imagem \`$TAG\` publicada; nada foi enviado à VPS."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          erros=()
          [[ ${#faltam[@]} -eq 0 ]] || erros+=("faltam no environment producao: ${faltam[*]} (AWS_DEPLOY_ROLE_ARN, AWS_REGION, DEPLOY_INSTANCE_ID)")
          [[ -z "$ROLE_ARN" || "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || erros+=("AWS_DEPLOY_ROLE_ARN inválida")
          [[ -z "$REGIAO" || "$REGIAO" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || erros+=("AWS_REGION inválida")
          [[ -z "$INSTANCIA" || "$INSTANCIA" =~ ^i-[0-9a-f]{8,17}$ ]] || erros+=("DEPLOY_INSTANCE_ID inválido")
          [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || erros+=("tag inválida vinda do build: '$TAG'")
          [[ "$DIGEST_APP" =~ ^sha256:[0-9a-f]{64}$ && "$DIGEST_OPS" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || erros+=("digests inválidos vindos do build: '$DIGEST_APP' '$DIGEST_OPS'")
          if [[ ${#erros[@]} -gt 0 ]]; then
            for e in "${erros[@]}"; do echo "::error title=Deploy mal configurado::$e"; done
            exit 1
          fi
          echo "pronto=true" >> "$GITHUB_OUTPUT"

      - name: Credenciais da AWS (OIDC)
        if: steps.config.outputs.pronto == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ij-crm-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # send-command do documento ij-crm-deploy e acompanhamento até um estado
      # final. O código de saída do deploy.sh na VPS vira o resultado do job
      # (≠ 0, inclusive com rollback automático = ❌ + email). Status que não dá
      # para saber (API fora, prazo do job) NÃO é dado como falha certa.
      - name: Deploy via SSM
        if: steps.config.outputs.pronto == 'true'
        env:
          INTERVALO: "15"   # s entre consultas
          PRAZO: "3000"     # s de acompanhamento (timeout do documento: 2700)
        run: |
          set -uo pipefail
          cmd_id="-"
          resumo() {
            {
              echo "### Deploy automático"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Tag | \`$TAG\` |"
              echo "| Commit | \`$GITHUB_SHA\` |"
              echo "| Digest app | \`$DIGEST_APP\` |"
              echo "| Digest ops | \`$DIGEST_OPS\` |"
              echo "| Comando SSM | \`$cmd_id\` (instância \`$INSTANCIA\`) |"
              echo "| Resultado | $1 |"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          params="$(jq -cn --arg t "$TAG" --arg a "$DIGEST_APP" --arg o "$DIGEST_OPS" \
            '{tag: [$t], digestApp: [$a], digestOps: [$o]}')"
          if ! cmd_id="$(aws ssm send-command --document-name "$DOCUMENTO" --instance-ids "$INSTANCIA" \
                --parameters "$params" --timeout-seconds 600 \
                --comment "ij-crm $TAG run $GITHUB_RUN_ID" \
                --query Command.CommandId --output text)" || [[ -z "$cmd_id" ]]; then
            cmd_id="-"
            resumo "❌ não enviado: \`send-command\` falhou (permissão da role, documento ou instância; veja o log do passo). Nada rodou na VPS."
            echo "::error title=Deploy não enviado::send-command falhou"
            exit 1
          fi
          echo "Comando SSM $cmd_id enviado (tag $TAG)"

          status="" detalhe="" ultimo="" erros_api=0 inv="{}"
          limite=$((SECONDS + PRAZO))
          while (( SECONDS < limite )); do
            sleep "$INTERVALO"
            if novo="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCIA" \
                  --output json 2>"$RUNNER_TEMP/ssm-erro")"; then
              erros_api=0
              inv="$novo"
              status="$(jq -r '.Status // ""' <<<"$inv")"
              detalhe="$(jq -r '.StatusDetails // ""' <<<"$inv")"
              if [[ "$status/$detalhe" != "$ultimo" ]]; then echo "SSM: $status ($detalhe)"; ultimo="$status/$detalhe"; fi
              case "$status" in Success | Failed | TimedOut | Cancelled) break ;; esac
            else
              # Logo depois do send-command a invocação pode ainda não existir.
              erros_api=$((erros_api + 1))
              if (( erros_api >= 20 )); then
                cat "$RUNNER_TEMP/ssm-erro"
                status="" detalhe="get-command-invocation falhando"
                break
              fi
            fi
          done

          codigo="$(jq -r '.ResponseCode // ""' <<<"$inv")"
          saida="$(jq -r '.StandardOutputContent // ""' <<<"$inv")"
          echo "----- saída do deploy na VPS (fim do log; completo em /var/log/ij-crm/deploy-*-$TAG.log) -----"
          printf '%s\n' "$saida"
          jq -r '.StandardErrorContent // ""' <<<"$inv"
          echo "-----"

          rc=1
          case "$status" in
            Success)
              rc=0; resultado="✅ ok: \`$TAG\` no ar" ;;
            Failed)
              if [[ "$detalhe" == Undeliverable || "$detalhe" == Terminated ]]; then
                resultado="❌ SSM: $detalhe (instância sem agente SSM/parada); verifique o status no SSM"
              elif [[ "$codigo" == 2 ]] || grep -q "deploy-remoto: recusado" <<<"$saida"; then
                resultado="❌ recusado na VPS por scripts/deploy-remoto.sh (tag, digest ou commit fora da main); nada rodou"
              elif grep -q "rollback automático ok" <<<"$saida"; then
                resultado="❌ deploy falhou; rollback automático para a versão anterior ok"
              elif grep -q "rollback automático para .* também falhou" <<<"$saida"; then
                resultado="❌ deploy falhou e o rollback automático TAMBÉM falhou: intervenção manual (runbook §2)"
              else
                resultado="❌ deploy.sh falhou (código ${codigo:-?}); veja a saída neste passo e o log na VPS"
              fi ;;
            TimedOut)
              if [[ "$detalhe" == DeliveryTimedOut ]]; then
                resultado="❌ não entregue a tempo (instância offline ou sem agente SSM); nada rodou"
              else
                resultado="❌ estourou o tempo do SSM. O deploy.sh roda destacado e pode ter terminado ou ainda estar rodando: verifique o status no SSM e o log /var/log/ij-crm/deploy-*-$TAG.log"
              fi ;;
            Cancelled)
              resultado="❌ cancelado no SSM. Se já tinha começado, o deploy.sh segue destacado até o fim: confira o log na VPS" ;;
            *)
              resultado="⚠️ status desconhecido (último: ${status:-nenhum}${detalhe:+, $detalhe}); NÃO quer dizer que falhou: verifique o status no SSM (comando $cmd_id)" ;;
          esac
          resumo "$resultado"
          if [[ $rc -ne 0 ]]; then echo "::error title=Deploy $TAG::$resultado"; fi
          exit "$rc"
