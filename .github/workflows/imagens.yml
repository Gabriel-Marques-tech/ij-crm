# Build das imagens de produção FORA da VPS (a VPS só faz `docker pull`).
#
#   app  ← Dockerfile, estágio `runtime` (serviço `app` do compose.prod.yml)
#   ops  ← Dockerfile, estágio `ops`     (serviço one-shot `migrate`)
#
# Tags: `sha-<commit curto>` (imutável, é o que o deploy/rollback usa) e `latest`
# (SÓ a partir da main; dispatch de outra branch publica só `sha-…`).
# Actions fixadas por SHA de commit (versão no comentário); atualize os dois juntos.
#
# Deploy automático: depois do build de um push na main, o job `deploy` manda a
# tag `sha-<commit curto>` por SSH para a VPS, onde o comando forçado da chave
# (scripts/deploy-remoto.sh) roda `scripts/deploy.sh <tag>`. Environment
# `producao` com os secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY e
# DEPLOY_KNOWN_HOSTS; sem eles o job é pulado com um aviso. Pausa: variável de
# repositório DEPLOY_AUTOMATICO=false. Ver docs/runbook.md, "Deploy automático".
name: imagens

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nada por padrão; cada job pede só o que usa.
permissions: {}

# Dois pushes seguidos na main: o segundo espera (build E deploy do primeiro);
# `latest` nunca regride.
concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/gabriel-marques-tech
  # Arquitetura da VPS. Instância Graviton (t4g/m7g/…): defina a variável de
  # repositório IMAGE_PLATFORMS=linux/arm64 (build via QEMU, bem mais lento).
  PLATAFORMAS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: QEMU (só para arm64)
        if: contains(env.PLATAFORMAS, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags do app
        id: meta-app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-app
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # A tag que o deploy usa, conferida contra a lista que o metadata-action
      # gerou (e que o build abaixo publica): o deploy leva exatamente esta imagem.
      - name: Tag imutável do deploy
        id: tag
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          IMAGEM: ${{ env.REGISTRO }}/ij-crm-app
        run: |
          tag="sha-${GITHUB_SHA::7}"
          grep -qxF "$IMAGEM:$tag" <<<"$TAGS_APP" \
            || { echo "::error::$IMAGEM:$tag não está nas tags geradas: $TAGS_APP"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tags do ops
        id: meta-ops
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRO }}/ij-crm-ops
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Mesmo builder nos dois passos: o estágio `deps` (pnpm install) do app é
      # reaproveitado pelo ops. Cache entre execuções no cache do GitHub Actions.
      - name: Build + push app (runtime)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build + push ops (migrate)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ops
          platforms: ${{ env.PLATAFORMAS }}
          push: true
          tags: ${{ steps.meta-ops.outputs.tags }}
          labels: ${{ steps.meta-ops.outputs.labels }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=ops
          cache-to: type=gha,scope=ops,mode=max

      - name: Resumo
        env:
          TAGS_APP: ${{ steps.meta-app.outputs.tags }}
          TAGS_OPS: ${{ steps.meta-ops.outputs.tags }}
          TAG: ${{ steps.tag.outputs.tag }}
          PAUSADO: ${{ vars.DEPLOY_AUTOMATICO == 'false' }}
        run: |
          {
            echo "### Imagens publicadas"
            echo
            echo '```'
            echo "$TAGS_APP"
            echo "$TAGS_OPS"
            echo '```'
            echo
            if [[ "$PAUSADO" == "true" ]]; then
              echo "Deploy automático **pausado** (variável DEPLOY_AUTOMATICO=false)."
            fi
            echo "Deploy manual na VPS: \`scripts/deploy.sh $TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy automático na VPS (AWS) da imagem que o job `build` acabou de publicar.
  # Só em push na main com build ok; pausável com a variável de repositório
  # DEPLOY_AUTOMATICO=false (o job aparece como "skipped").
  deploy:
    needs: build
    if: >-
      success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_AUTOMATICO != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sem token do GitHub: o job não faz checkout nem usa a API, só SSH.
    permissions: {}
    environment:
      name: producao
    # Um deploy por vez, na ordem dos merges; um em andamento nunca é cancelado.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # Sem a VPS ainda: nenhum secret configurado → pula com aviso (não falha).
      # Configuração pela metade → falha (é erro de quem configurou).
      - name: Conferir configuração
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          faltam=()
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!v}" ]] || faltam+=("$v")
          done
          if [[ ${#faltam[@]} -eq 4 ]]; then
            echo "::notice title=Deploy pulado::Secrets de deploy ausentes no environment producao (runbook: Deploy automático). Imagem $TAG publicada, sem deploy."
            {
              echo "### Deploy automático: pulado"
              echo
              echo "Secrets \`DEPLOY_*\` ainda não configurados no environment \`producao\`."
              echo "Imagem \`$TAG\` publicada; nada foi enviado à VPS."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          elif [[ ${#faltam[@]} -gt 0 ]]; then
            echo "::error title=Deploy mal configurado::faltam no environment producao: ${faltam[*]}"
            exit 1
          else
            [[ "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "::error::tag inválida vinda do build: '$TAG'"; exit 1; }
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Chave SSH e host conhecido
        if: steps.config.outputs.pronto == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy

      # O servidor ignora o comando e roda o forçado (scripts/deploy-remoto.sh),
      # que só aceita a tag. A saída do deploy.sh aparece aqui ao vivo; o código
      # de saída dele vira o do job (≠ 0, inclusive com rollback automático = ❌).
      - name: Deploy ${{ env.TAG }}
        if: steps.config.outputs.pronto == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          saida="$RUNNER_TEMP/deploy.log"
          set +e
          ssh -T \
            -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$TAG" 2>&1 | tee "$saida"
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) resultado="✅ ok: \`$TAG\` no ar" ;;
            255) resultado="❌ SSH falhou (conexão, chave ou host key; veja o log do passo)" ;;
            *)
              if grep -q "^deploy-remoto: recusado" "$saida"; then
                resultado="❌ recusado pelo servidor (scripts/deploy-remoto.sh não aceitou a tag)"
              elif grep -q "rollback automático ok" "$saida"; then
                resultado="❌ falhou; rollback automático para a versão anterior ok"
              elif grep -q "rollback automático para .* também falhou" "$saida"; then
                resultado="❌ falhou e o rollback automático TAMBÉM falhou: intervenção manual (runbook §2)"
              else
                resultado="❌ falhou (código $rc; veja o log do passo e runbook §1–§2)"
              fi ;;
          esac
          {
            echo "### Deploy automático"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Resultado | $resultado |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=Deploy falhou::$resultado"
          fi
          exit "$rc"

      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts_deploy
