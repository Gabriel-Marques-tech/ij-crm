services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijcrm
      POSTGRES_PASSWORD: ijcrm
      POSTGRES_DB: ijcrm
    # Só loopback: credenciais de dev são públicas, nada de expor na LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijcrm -d ijcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ijcrm:ijcrm@db:5432/ijcrm?schema=public
      # Dentro do compose a Evolution é alcançada pelo nome do serviço, não por localhost.
      EVOLUTION_API_URL: http://evolution:8080
    # Só loopback até a auth (GAB-26) existir; em prod o Caddy publica (GAB-30).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # :z = label SELinux (Fedora); sem isso o container recebe EACCES no bind mount.
      - .:/app:z
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      db:
        condition: service_healthy
    # Roda a cada `up`: idempotente, mas o install pode levar alguns minutos na 1ª vez.
    command: sh -c "pnpm install --frozen-lockfile && pnpm prisma migrate deploy && pnpm prisma db seed && pnpm dev"

  # ---- WhatsApp: Evolution API v2 (GAB-28) ----
  # Perfil `whatsapp`: `docker compose --profile whatsapp up -d`. Sem o perfil,
  # `docker compose up -d db` continua funcionando num .env sem EVOLUTION_API_KEY.
  # Imagem oficial mudou de atendai/ para evoapicloud/ a partir da v2.3.0.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["whatsapp"]
    restart: unless-stopped
    # Só loopback: o app (no compose) chega por http://evolution:8080.
    ports:
      - "127.0.0.1:8080:8080"
    # Para o webhook alcançar um `pnpm dev` rodando nativo no host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8080
      # Mesma chave que o app usa em EVOLUTION_API_KEY (.env). O compose interpola
      # mesmo com o perfil desligado, então não dá para exigir (`:?`) sem quebrar
      # `up -d db`; o default é um placeholder que o app REJEITA (prefixo
      # `troque-me`): com ele a Evolution sobe, mas nada autentica nem envia.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-me-defina-EVOLUTION_API_KEY-no-env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ij-crm
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Design §2: conteúdo que não é venda não fica em lugar nenhum — nem no
      # banco da Evolution. A citação da confirmação manda o texto junto
      # (`quoted.message`), então ela não precisa guardar mensagens.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Webhook é configurado POR INSTÂNCIA (README); o global fica desligado.
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      # Re-tentativas do webhook (v2.3.7: padrão 10 tentativas, backoff até 300s).
      # 5xx/timeout re-tentam; 4xx não (o app devolve 400/401 só para erro definitivo).
      WEBHOOK_REQUEST_TIMEOUT_MS: "30000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "5"
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: "5"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: "120"
      WEBHOOK_RETRY_JITTER_FACTOR: "0.2"
      WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES: "400,401,403,404,422"
      CONFIG_SESSION_PHONE_CLIENT: IJ CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started

  evolution-db:
    image: postgres:16-alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    # Sem porta no host: só a Evolution fala com este banco.
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    profiles: ["whatsapp"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

volumes:
  db_data:
  app_node_modules:
  app_next:
  evolution_instances:
  evolution_db_data:
  evolution_redis_data:
