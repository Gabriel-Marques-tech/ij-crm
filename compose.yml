services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijcrm
      POSTGRES_PASSWORD: ijcrm
      POSTGRES_DB: ijcrm
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijcrm -d ijcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ijcrm:ijcrm@db:5432/ijcrm?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm install --frozen-lockfile && pnpm prisma migrate deploy && pnpm prisma db seed && pnpm dev"

volumes:
  db_data:
  app_node_modules:
  app_next:
